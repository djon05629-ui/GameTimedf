{% if page.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Страницы">
  {% if page.has_previous %}<a href="?{{ extra }}{% if extra %}&{% endif %}page={{ page.previous_page_number }}">Назад</a>{% endif %}
  <span>Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{{ extra }}{% if extra %}&{% endif %}page={{ page.next_page_number }}">Дальше</a>{% endif %}
</nav>
{% endif %}
