<div class="field{% if field.errors %} has-error{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    <label class="check-row">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<small class="hint">{{ field.help_text|safe }}</small>{% endif %}
  {% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}
</div>
