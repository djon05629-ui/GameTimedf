{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block content %}
<a class="back" href="{% url 'panel' %}">← Панель клуба</a>
<h1>Пользователи и роли</h1>
<div class="table-wrap"><table class="table">
  <thead><tr><th>Логин</th><th>Email</th><th>Роль</th><th></th></tr></thead>
  <tbody>
  {% for u in page %}
  <tr>
    <td>{{ u.username }}</td><td>{{ u.email }}</td>
    <td colspan="2">
      <form method="post" class="inline-form">{% csrf_token %}
        <input type="hidden" name="user" value="{{ u.pk }}">
        <select name="role" class="input" aria-label="Роль {{ u.username }}">
          {% for v, l in roles %}<option value="{{ v }}" {% if v == u.role %}selected{% endif %}>{{ l }}</option>{% endfor %}
        </select>
        <button class="btn btn-ghost btn-sm">Сохранить</button>
      </form>
    </td>
  </tr>
  {% endfor %}
  </tbody>
</table></div>
{% include "partials/_pagination.html" with extra="" %}
{% endblock %}
